<title>CV | Zheng (Bella) CHEN</title>
<style>
  :root {
    --primary: #003366;
    --accent: #0a66c2;
    --bg: #f7f8fa;
    --card: #ffffff;
    --text: #1f2937;
    --muted: #6b7280;
    --border: #e5e7eb;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.6;
  }
  nav {
    background: var(--card);
    border-bottom: 1px solid var(--border);
    position: sticky; top: 0; z-index: 100;
  }
  .nav-inner {
    max-width: 980px; margin: 0 auto; padding: 0.9rem 1.2rem;
    display: flex; justify-content: space-between; align-items: center;
  }
  .nav-logo { font-weight: 700; color: var(--primary); text-decoration: none; font-size: 1.1rem; }
  .nav-links { display: flex; gap: 1.5rem; }
  .nav-links a { color: var(--text); text-decoration: none; font-size: 0.95rem; }
  .nav-links a:hover, .nav-links a.active { color: var(--accent); }
  .container { max-width: 980px; margin: 0 auto; padding: 2rem 1.2rem 4rem; }
  h1 { font-size: 1.7rem; color: var(--primary); margin-bottom: 1rem; }
  .download-btn {
    display: inline-block; background: var(--primary); color: white; text-decoration: none;
    padding: 0.5rem 1.2rem; border-radius: 8px; font-size: 0.95rem; margin-bottom: 1.2rem;
  }
  .download-btn:hover { background: #002244; }
  .pdf-viewer {
    width: 100%; height: 85vh; border: 1px solid var(--border); border-radius: 12px;
    background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.06);
  }
  footer { text-align: center; color: var(--muted); font-size: .82rem; margin-top: 2rem; }
  @media (max-width: 640px) {
    .nav-inner { flex-direction: column; gap: .6rem; }
    .pdf-viewer { height: 70vh; }
  }
</style>
</head>
<body>
<nav>

    <div class="nav-links">

      <a href="industry.html">Industry</a>
      <a href="cv.html" class="active">CV</a>
    </div>

</nav>

  <footer>
